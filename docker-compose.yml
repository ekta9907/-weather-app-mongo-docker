services:

  app:
    build: .
    container_name: weather-app

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/weatherapp
      WEATHER_API_KEY: YOUR_API_KEY

    depends_on:
      - mongo

  mongo:
    image: mongo:8

    container_name: weather-mongo

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: